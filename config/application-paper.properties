# =============================================================================
# Bitget Arb Bot — Paper Mode Configuration
# No real API calls. Simulates ~200ms network latency per leg.
# =============================================================================

# --- API Credentials (not used in paper mode) ---
bitget.api.key=
bitget.api.secret=
bitget.api.passphrase=

# --- Endpoints ---
bitget.ws.url=wss://ws.bitget.com/v2/ws/public
bitget.rest.url=https://api.bitget.com

# --- Engine ---
engine.tick.ms=100
heartbeat.timeout.ms=5000

# --- Trading ---
min.profit.bps=5
max.position.usdt=1000
exchange.fee.rate=0.001
exchange.fee.legs=3

# --- Triangles ---
triangles=SOL/BTC/USDT,XRP/BTC/USDT,DOGE/BTC/USDT,TRX/BTC/USDT,BGB/BTC/USDT

# --- Network ---
network.max.latency.ms=400
network.check.interval.s=30
network.preflight.samples=5
network.runtime.samples=3
network.ping.endpoint=/api/v2/public/time
