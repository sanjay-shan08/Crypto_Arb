# =============================================================================
# Bitget Arb Bot — Paper Mode Configuration
# No real API calls. Simulates ~200ms network latency per leg.
# =============================================================================

# --- API Credentials (not used in paper mode) ---
bitget.api.key=
bitget.api.secret=
bitget.api.passphrase=

# --- Endpoints ---
bitget.ws.url=wss://ws.bitget.com/v2/ws/public
bitget.rest.url=https://api.bitget.com

# --- Engine ---
engine.tick.ms=100
heartbeat.timeout.ms=5000

# --- Trading ---
min.profit.bps=5
max.position.usdt=1000
exchange.fee.rate=0.001
exchange.fee.legs=3

# --- Triangles (ALT/INTER/BASE) ---
# BTC intermediary: SOL, BGB, ETH
# USDC intermediary: SOL, XRP, ADA, DOGE, LINK, BCH, AVAX, LTC, BGB, BNB, UNI, AAVE, SUI, PEPE
# ETH intermediary: TRX, BGB
triangles=SOL/BTC/USDT,BGB/BTC/USDT,ETH/BTC/USDT,SOL/USDC/USDT,XRP/USDC/USDT,ADA/USDC/USDT,DOGE/USDC/USDT,LINK/USDC/USDT,BCH/USDC/USDT,AVAX/USDC/USDT,LTC/USDC/USDT,BGB/USDC/USDT,BNB/USDC/USDT,UNI/USDC/USDT,AAVE/USDC/USDT,SUI/USDC/USDT,PEPE/USDC/USDT,TRX/ETH/USDT,BGB/ETH/USDT

# --- Network ---
network.max.latency.ms=600
network.check.interval.s=30
network.preflight.samples=5
network.runtime.samples=3
network.ping.endpoint=/api/v2/public/time
